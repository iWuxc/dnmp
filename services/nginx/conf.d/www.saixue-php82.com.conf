# PHP 8.5 运行时验证站点（P1）：root 与 6.x 联调站点相同，仅把 FPM 指向 php85
server {
    server_name  www.saixue-php82.com;
    listen       80;

    root   /www/sx-scrm-tp6;
    index  index.php index.html index.htm;

    # 6.x 把框架代码、配置、运行时都放在仓库根，必须逐项挡住：
    #   app/ 是业务代码（原 application/），config/ 里有数据库与 Redis 连接的读取入口，
    #   extend/ 是本项目自己的库，vendor/ 是框架本体，runtime/ 有日志，
    #   .app.env 里是凭据（本地也是同一份键名结构，绝不能被下载）。
    location ~* (^/(app|config|extend|route|bootstrap|vendor|runtime|build|docs)/)|\.(env|sql|log|md|lock|json|sh|bak|ini|ya?ml|tar\.gz|zip)$|(^|/)\.(git|app_env|ht) {
        return 403;
    }

    # --- CRM 前端产物：与 5.0 站点同一份 dist（前端代码与版本无关：`code:302` 载荷两侧逐字段相同，08 §3.40）---
    # 6.x 工作树里没有 public/frontend，所以这里直接指过去，不复制、不改前端一行代码。
    # 这三条必须是 `=`／`^~`（精确与前缀优先），否则会被上面那条 `~*` deny 正则抢先按 URI 结构判掉。
    location = / {
        root /www/sx-scrm-backend/public/frontend;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        root /www/sx-scrm-backend/public/frontend;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico {
        root /www/sx-scrm-backend/public/frontend;
    }

    location ^~ /static/ {
        alias /www/sx-scrm-backend/public/frontend/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 上传件走同一份宿主目录（与 5.0 站点同一条 alias），并禁止uploads 目录里的 PHP 被执行
    location ^~ /public/uploads/ {
        alias /mnt/oss/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;

        location ~ \.php$ {
            deny all;
        }
    }

    # --- API 路由（PHP 后端）：与 5.0 站点同一条 rewrite，保证 ?s= 与模块/控制器/动作两种入口都能走 ---
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, authKey, sessionId, device-token" always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain charset=UTF-8" always;
            return 204;
        }
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
        }
    }

    access_log /dev/null;
    error_log  /var/log/nginx/nginx.saixue-php82.error.log warn;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_pass   php85:9000;
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;
        fastcgi_param  QUERY_STRING     $query_string;
        include        fastcgi_params;
    }
}

