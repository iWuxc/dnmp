server {
    server_name  www.saixue.com;
    listen       80;

    root   /www/sx-scrm-backend;
    index  index.php index.html index.htm;

    location ~* (runtime|application)/{
        return 403;
    }

    # --- CRM 前端页面 ---
    location = / {
        root /www/sx-scrm-backend/public/frontend;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        root /www/sx-scrm-backend/public/frontend;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico {
        root /www/sx-scrm-backend/public/frontend;
    }

    # --- CRM 前端静态资源 (长缓存) ---
    location ^~ /static/ {
        alias /www/sx-scrm-backend/public/frontend/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- OSS 文件服务 ---
    location ^~ /public/uploads/ {
        alias /mnt/oss/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;

        location ~ \.php$ {
            deny all;
        }
    }

    # --- API 路由 (PHP后端) ---
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, authKey, sessionId, device-token" always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain charset=UTF-8" always;
            return 204;
        }
        if (!-e $request_filename){
            rewrite ^(.*)$ /index.php?s=$1 last;
        }
    }

    access_log /dev/null;
    error_log  /var/log/nginx/nginx.localhost.error.log warn;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_pass   php74:9000;
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;
        fastcgi_param  QUERY_STRING     $query_string;
        include        fastcgi_params;
    }
}
