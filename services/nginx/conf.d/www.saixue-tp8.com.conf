# TP8 验证站点（P3）：root 指向 tp8 工作树，FPM 指向 php85
# 回滚：删掉本文件 + nginx -s reload
server {
    server_name  www.saixue-tp8.com;
    listen       80;

    root   /www/sx-scrm-tp8;
    index  index.php index.html index.htm;

    # 与 tp6/php85 站点同一套遮挡：业务代码、配置、凭据、运行时都不能被下载
    location ~* (^/(app|config|extend|route|bootstrap|vendor|runtime|build|docs)/)|\.(env|sql|log|md|lock|json|sh|bak|ini|ya?ml|tar\.gz|zip)$|(^|/)\.(git|app_env|ht) {
        return 403;
    }

    # CRM 前端产物共用 5.0 站点那一份 dist
    location = / {
        root /www/sx-scrm-backend/public/frontend;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        root /www/sx-scrm-backend/public/frontend;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico {
        root /www/sx-scrm-backend/public/frontend;
    }

    location ^~ /static/ {
        alias /www/sx-scrm-backend/public/frontend/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /public/uploads/ {
        alias /mnt/oss/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;

        location ~ \.php$ {
            deny all;
        }
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, authKey, sessionId, device-token" always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain charset=UTF-8" always;
            return 204;
        }
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
        }
    }

    access_log /dev/null;
    error_log  /var/log/nginx/nginx.saixue-tp8.error.log warn;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_pass   php85:9000;
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;
        fastcgi_param  QUERY_STRING     $query_string;
        include        fastcgi_params;
    }
}
